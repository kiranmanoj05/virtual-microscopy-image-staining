[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-microscopy-image-staining"
version = "0.1.0"
description = "Reproducible brightfield-to-fluorescence experiments"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "numpy>=1.26,<3", "tifffile", "imagecodecs", "scikit-image", "matplotlib"]
viewer = ["numpy>=1.26,<3", "scikit-image", "matplotlib", "pillow"]

[project.scripts]
staining = "virtual_staining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_staining = ["viewer_template.html"]
