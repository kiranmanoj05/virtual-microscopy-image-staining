name: checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'numpy>=1.26,<3' tifffile imagecodecs matplotlib
      - run: python -m unittest discover -s tests -v
      - run: staining doctor
